[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenspeed-spec-contract-fixture"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["tokenspeed"]

[project.entry-points."tokenspeed.plugins"]
spec_contract_fixture = "tokenspeed_spec_fixture:register"

[tool.setuptools.packages.find]
include = ["tokenspeed_spec_fixture*"]
